<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Призраки</title>
    <link rel="icon" type="image/png" href="./favicons/ghost.png">
    <style>
    body {
        margin: 0;
        padding: 20px;
        background-color: rgb(58, 75, 82); /* Цвет океана */
        display: flex;
        justify-content: center;
        /* ИСПРАВЛЕНИЕ ДЛЯ МОБИЛЬНЫХ: не дает контенту ломать границы экрана */
        overflow-x: hidden; 
    }

    /* Контейнер карты */
    .map-container {
        position: relative;
        width: 684px; 
        max-width: 100%;
        height: auto;
        aspect-ratio: 684 / 1017;

        transform-origin: 0 0;
        transform: translate(var(--zoom-x, 0px), var(--zoom-y, 0px)) scale(var(--map-scale, 1));
        transition: transform 0.1s ease-out;
        /* Настройки для плавного перетаскивания без выделения */
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        cursor: grab;
    }

    .map-container:active {
        cursor: grabbing;
    }

    /* Картинка подложки карты */
    .map-image {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none; /* Чтобы браузер не перетаскивал саму картинку-призрак */
    }

    /* Общий стиль для всех меток */
    .marker {
        position: absolute;
        width: calc(12px / (var(--map-scale, 1) * var(--mobile-zoom, 1)));
        aspect-ratio: 1 / 1; 
        border: calc(2px / (var(--map-scale, 1) * var(--mobile-zoom, 1))) solid #782092;
        background-color: red;
        border-radius: 50%;
        transform: translate(-50%, -50%); 
        cursor: pointer;
        z-index: 10;
        box-sizing: border-box; 
    }

    /* Стиль для карт */
    .marker.ghost {
        background-color: #782092;
    }

    /* Стиль всплывающего окна с текстом */
    .marker::after {
        content: attr(data-title);
        position: absolute;
        bottom: 25px; 
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 20, 0.95); 
        color: white;
        padding: 8px;
        border-radius: 6px;
        font-size: 13px;
        font-family: Arial, sans-serif;
        white-space: pre-line; 
        display: none; 
        z-index: 20;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        border: 1px solid rgb(17, 18, 24); 
        text-align: center;
    }

    .marker:hover::after { display: block; }
    .marker.show-screenshot:hover::after { display: none; }

    /* БАЗОВЫЙ СТИЛЬ СКРИНШОТА (Здесь основные исправления) */
    .marker img {
        display: none;
        position: absolute;
        bottom: 25px; 
        left: 50%;
        transform: translateX(-50%);
        
        /* Вычисляемая ширина скриншота */
        width: calc(320px / (var(--map-scale, 1) * var(--mobile-zoom, 1)));
        
        /* ИСПРАВЛЕНИЕ ДЛЯ ПК: Картинка сжимается вслед за зумом, но НЕ МЕНЬШЕ 220px. 
           Это создаст красивый предел при отдалении карты */
        min-width: 130px; 
        /* Ограничитель сверху, чтобы при огромном приближении картинка не перекрывала всё */
        max-width: 450px; 

        aspect-ratio: 16 / 9; 
        height: auto; 
        
        border: calc(2px / (var(--map-scale, 1) * var(--mobile-zoom, 1))) solid #782092;
        border-radius: 6px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
        z-index: 100;
        pointer-events: none; 
        object-fit: cover;
    }

    /* Класс показа скрина */
    .marker.show-screenshot img {
        display: block;
        animation: fadeIn 0.2s ease-in-out;
    }

    .marker.show-screenshot { z-index: 9999; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-50%) translateY(5px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .marker.ghost.collected {
        background-color: rgba(102, 102, 102, 0.5); 
        border: 1px solid rgba(153, 153, 153, 0.5); 
        box-shadow: none;                            
    }

    .marker.ghost.collected img {
        opacity: 1 !important;
        filter: none !important;
    }

    /* Панель управления счетчиком */
.counter-box {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(20, 20, 20, 0.85);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    border: 1px solid #782092;
    z-index: 99999;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    gap: 12px;
}

.counter-box span:first-child {
    pointer-events: none; /* Текст не мешает кликам */
}

#counter-value {
    color: #782092;
}

/* Кнопка сброса */
#reset-btn {
    background: rgba(255, 68, 68, 0.2);
    border: 1px solid #ff4444;
    color: #ff8888;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: none; /* Скрыта по умолчанию */
}

#reset-btn:hover {
    background: #ff4444;
    color: #fff;
    box-shadow: 0 0 8px rgba(255, 68, 68, 0.5);
}

</style>


</head>
<body>

    <!-- Контейнер с картой -->

        <!-- Картинка фона -->

        <!-- ТОЧНЫЕ метки -->
<div class="marker ghost" id="ghost_1" style="left: 46.7%; top: 12.9%;" data-title="20:00-21:00"><img data-src="./ghosts/1.jpg" loading="lazy" alt="в работе"></div>

<!-- ==========================================
    HTML И CSS ДЛЯ ЭФФЕКТА RESPECT + В ТОЧНОМ СТИЛЕ GTA SA
    ========================================== -->
<style>
    /* Подключаем ваш локальный шрифт Pricedown */
    @font-face {
        font-family: 'Pricedown';
        src: url('./fonts/pricedown.otf') format('opentype'); 
        font-weight: normal;
        font-style: normal;
    }

    /* Полный экран для оверлея */
    .respect-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0); 
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999; 
        pointer-events: none; 
        transition: background 0.8s ease;
    }

    /* Контейнер надписей */
    .gta-mission-box {
        font-family: 'Pricedown', 'Arial Black', sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0px; /* В игре строчки расположены очень близко друг к другу */
        opacity: 0;
        transform: scale(0.6);
        transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1.15);
    }

    /* 1. ВЕРХНЯЯ СТРОКА: Золотой градиент */
    .mission-title {
        font-size: 7.5rem;
        letter-spacing: -1px;
        background: linear-gradient(to bottom, #7527f3 0%, #782092 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.05;
        /* Четкий черный контур для прозрачного градиентного текста */
        filter: drop-shadow(-2.5px -2.5px 0 #000) 
                drop-shadow(2.5px -2.5px 0 #000) 
                drop-shadow(-2.5px 2.5px 0 #000) 
                drop-shadow(2.5px 2.5px 0 #000);
    }

    /* 2. НИЖНЯЯ СТРОКА: Полностью белая с черной обводкой */
    .respect-row {
        font-size: 5rem;
        color: #ffffff;
        letter-spacing: -0.5px;
        line-height: 1.1;
        display: flex;
        align-items: center;
        gap: 12px;
        /* Классическая обводка text-shadow для сплошного белого цвета */
        text-shadow: 
            -2.5px -2.5px 0 #000,  2.5px -2.5px 0 #000, 
            -2.5px  2.5px 0 #000,  2.5px  2.5px 0 #000,
            -2.5px  0px   0 #000,  2.5px  0px   0 #000,  
                0px  -2.5px 0 #000,  0px   2.5px 0 #000;
    }

    /* Активация эффекта при вызове скрипта */
    .respect-overlay.active {
        background: rgba(0, 0, 0, 0.35); /* Легкое внутриигровое затемнение */
    }
    
    .respect-overlay.active .gta-mission-box {
        opacity: 1;
        transform: scale(1);
    }

    /* Корректное отображение на мобильных устройствах */
    @media (max-width: 768px) {
        .mission-title {
            font-size: 4rem;
        }
        .respect-row {
            font-size: 2.6rem;
            gap: 8px;
        }
        .mission-title {
            filter: drop-shadow(-1.5px -1.5px 0 #000) drop-shadow(1.5px -1.5px 0 #000) drop-shadow(-1.5px 1.5px 0 #000) drop-shadow(1.5px 1.5px 0 #000);
        }
        .respect-row {
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
        }
    }
</style>

<!-- Двухстрочный оверлей в точном соответствии с игрой -->
<div id="respect-screen" class="respect-overlay">
    <div class="gta-mission-box">
        <!-- Для шрифта Pricedown пишем именно строчными (маленькими) буквами -->
        <div class="mission-title">миссия выполнена!</div>
        <div class="respect-row">
            <span>УВАЖЕНИЕ</span>
            <span>+</span>
        </div>
    </div>
</div>
<!-- ========================================== -->

<script>
    // Получаем необходимые элементы интерфейса
    const mapContainer = document.querySelector('.map-container');
    const counterValue = document.getElementById('counter-value');
    const resetBtn = document.getElementById('reset-btn');

    // Настройки для эффекта RESPECT
    const respectScreen = document.getElementById('respect-screen');
    const respectAudio = new Audio("./audio/respect2.m4a");
    let isRespectTriggered = false;

    // Настройки зума и сдвига карты
    let scale = 1;
    let posX = 0;
    let posY = 0;

    // Переменные для перетаскивания зажатой ЛКМ и пальцем
    let isDragging = false;
    let hasDragged = false;
    let startX = 0;
    let startY = 0;
    let initialPinchDistance = null;
    let initialScale = 1;

    // Применение трансформаций (с плавностью для колеса и мгновенно при перетаскивании)
    function applyTransform(smooth = false) {
        mapContainer.style.transition = smooth ? 'transform 0.1s ease-out' : 'none';
        mapContainer.style.setProperty('--map-scale', scale);
        mapContainer.style.setProperty('--zoom-x', `${posX}px`);
        mapContainer.style.setProperty('--zoom-y', `${posY}px`);
    }

    // Функция обновления счетчика и видимости кнопки сброса
    function updateCounter() {
        const total = document.querySelectorAll('.marker.ghost').length;
        const collected = document.querySelectorAll('.marker.ghost.collected').length;
        counterValue.textContent = `${collected}/${total}`;

        resetBtn.style.display = collected > 0 ? 'inline-block' : 'none';

        if (collected < total) {
            isRespectTriggered = false;
        }
    }

    // Функция активации эффекта RESPECT +
    function triggerRespectEffect() {
        if (isRespectTriggered) return;
        isRespectTriggered = true;

        respectScreen.classList.add('active');
        respectAudio.play().catch(() => console.log("Кликните по карте, чтобы браузер разрешил воспроизведение звука"));

        setTimeout(() => {
            respectScreen.classList.remove('active');
        }, 13000);
    }

    // Обработчик клика по кнопке сброса прогресса
    resetBtn.addEventListener('click', () => {
        if (confirm('Вы уверены, что хотите сбросить весь прогресс фото призраков?')) {
            document.querySelectorAll('.marker.ghost').forEach(marker => {
                marker.classList.remove('collected', 'show-screenshot');
                localStorage.removeItem(marker.id);
            });
            updateCounter();
        }
    });

    // 1. УМНЫЙ ЗУМ ЗА МЫШКОЙ (ПК)
    mapContainer.addEventListener('wheel', (e) => {
        e.preventDefault();

        const rect = mapContainer.getBoundingClientRect();
        const cursorX = e.clientX - rect.left;
        const cursorY = e.clientY - rect.top;

        const originX = cursorX / scale;
        const originY = cursorY / scale;

        const zoomFactor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
        const nextScale = Math.max(1, Math.min(scale * zoomFactor, 25));

        posX += cursorX - originX * nextScale;
        posY += cursorY - originY * nextScale;
        scale = nextScale;

        if (scale === 1) { 
            posX = 0; 
            posY = 0; 
        }

        applyTransform(true);
    }, { passive: false });

    // 2. ПЕРЕТАСКИВАНИЕ КАРТЫ ЗАЖАТОЙ ЛКМ (ПК)
    mapContainer.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || scale === 0) return; // Работает только с ЛКМ и при зуме
        isDragging = true;
        hasDragged = false;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const moveX = e.clientX - startX;
        const moveY = e.clientY - startY;

        // Защита от ложного клика при сдвиге мыши больше чем на 3px
        if (Math.abs(moveX - posX) > 3 || Math.abs(moveY - posY) > 3) {
            hasDragged = true;
        }

        posX = moveX;
        posY = moveY;
        applyTransform(false);
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // 3. ПЕРЕТАСКИВАНИЕ И ЗУМ ДВУМЯ ПАЛЬЦАМИ (СМАРТФОНЫ)
    mapContainer.addEventListener('touchstart', (e) => {
        hasDragged = false;
        if (e.touches.length === 1 && scale > 1) {
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            initialScale = scale;
        }
    }, { passive: false });

    mapContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
            e.preventDefault();
            const moveX = e.touches[0].clientX - startX;
            const moveY = e.touches[0].clientY - startY;
            if (Math.abs(moveX - posX) > 4 || Math.abs(moveY - posY) > 4) {
                hasDragged = true;
            }
            posX = moveX;
            posY = moveY;
            applyTransform(false);
        } else if (e.touches.length === 2 && initialPinchDistance) {
            e.preventDefault();
            hasDragged = true;
            const currentDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const rect = mapContainer.getBoundingClientRect();
            const centerX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
            const centerY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
            
            const originX = centerX / scale;
            const originY = centerY / scale;
            const nextScale = Math.max(1, Math.min(initialScale * (currentDistance / initialPinchDistance), 25));

            posX += centerX - originX * nextScale;
            posY += centerY - originY * nextScale;
            scale = nextScale;

            if (scale === 1) { posX = 0; posY = 0; }
            applyTransform(false);
        }
    }, { passive: false });

    mapContainer.addEventListener('touchend', () => {
        isDragging = false;
        initialPinchDistance = null;
    });

    // СЛУШАТЕЛЬ УМЕНЬШЕНИЯ ДЛЯ СМАРТФОНОВ (Родной мобильный зум)
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            mapContainer.style.setProperty('--mobile-zoom', window.visualViewport.scale);
        });
    }

    // 4. БАЗОВАЯ ЛОГИКА (Авто-ID, Сбор призраков, Показ JPG скринов)
    document.querySelectorAll('.marker.ghost').forEach((marker, index) => {
        if (!marker.id) marker.id = 'p' + (index + 1);
        if (localStorage.getItem(marker.id) === 'collected') {
            marker.classList.add('collected');
        }
    });

    updateCounter();

    // Слушатель кликов по карте и меткам
    mapContainer.addEventListener('click', (event) => {
        // Если карту перетаскивали зажатой ЛКМ, игнорируем клик в момент отпускания кнопки
        if (hasDragged) {
            hasDragged = false;
            return;
        }

        const clickedMarker = event.target.closest('.marker.ghost');

        if (clickedMarker) {
            event.stopPropagation(); 
            if (event.target.tagName === 'IMG') return;

            if (clickedMarker.classList.contains('collected')) {
                clickedMarker.classList.remove('collected');
                localStorage.removeItem(clickedMarker.id); 
            } else {
                clickedMarker.classList.add('collected');
                localStorage.setItem(clickedMarker.id, 'collected'); 
            }

            updateCounter();

            const totalItems = document.querySelectorAll('.marker.ghost').length;
            const collectedItems = document.querySelectorAll('.marker.ghost.collected').length;
            if (collectedItems === totalItems && totalItems > 0) {
                triggerRespectEffect();
            }

            if (clickedMarker.classList.contains('show-screenshot')) {
                clickedMarker.classList.remove('show-screenshot');
            } else {
                document.querySelectorAll('.marker.ghost').forEach(m => m.classList.remove('show-screenshot'));
                
                const img = clickedMarker.querySelector('img');
                if (img && img.getAttribute('data-src')) {
                    img.src = img.getAttribute('data-src');
                    img.removeAttribute('data-src');
                }
                clickedMarker.classList.add('show-screenshot');
            }

        } else {
            // Клик мимо метки — закрыть все открытые скриншоты
            document.querySelectorAll('.marker.ghost').forEach(marker => {
                marker.classList.remove('show-screenshot');
            });

            // Генерация новых точек в F12 при клике на карту
            const rect = mapContainer.getBoundingClientRect();
            const left = (((event.clientX - rect.left) / rect.width) * 100).toFixed(2);
            const top = (((event.clientY - rect.top) / rect.height) * 100).toFixed(2);
            const nextIndex = document.querySelectorAll('.marker.ghost').length + 1;
            
            console.log(`<div class="marker ghost" style="left: ${left}%; top: ${top}%;" data-title="Призрак ${nextIndex}"><img data-src="./ghosts/${nextIndex}.jpg" alt="в работе"></div>`);
            
            updateCounter();
        }
    });
</script>

</body>
