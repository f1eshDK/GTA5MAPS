<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA5MAPS</title>
    <style>
    body {
        margin: 0;
        padding: 20px;
        background-color: rgb(58, 75, 82); /* Цвет океана */
        display: flex;
        justify-content: center;
        /* ИСПРАВЛЕНИЕ ДЛЯ МОБИЛЬНЫХ: не дает контенту ломать границы экрана */
        overflow-x: hidden; 
    }

    /* Контейнер карты */
    .map-container {
        position: relative;
        width: 684px;  
        height: 1017px; 
        
        /* ИСПРАВЛЕНИЕ ДЛЯ МОБИЛЬНЫХ: предотвращает жесткое растягивание и искажение пропорций */
        max-width: 100%;
        height: auto;
        aspect-ratio: 684 / 1017;

        transform-origin: 0 0;
        transform: translate(var(--zoom-x, 0px), var(--zoom-y, 0px)) scale(var(--map-scale, 1));
        transition: transform 0.1s ease-out;
    }

    /* Картинка подложки карты */
    .map-image {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* Общий стиль для всех меток */
    .marker {
        position: absolute;
        width: calc(12px / (var(--map-scale, 1) * var(--mobile-zoom, 1)));
        aspect-ratio: 1 / 1; 
        border: calc(2px / (var(--map-scale, 1) * var(--mobile-zoom, 1))) solid #0002ff;
        background-color: red;
        border-radius: 50%;
        transform: translate(-50%, -50%); 
        cursor: pointer;
        z-index: 10;
        box-sizing: border-box; 
    }

    /* Стиль для карт */
    .marker.cards {
        background-color: #002fff;
    }

    /* Стиль всплывающего окна с текстом */
    .marker::after {
        content: attr(data-title);
        position: absolute;
        bottom: 25px; 
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 20, 0.95); 
        color: white;
        padding: 8px;
        border-radius: 6px;
        font-size: 13px;
        font-family: Arial, sans-serif;
        white-space: pre-line; 
        display: none; 
        z-index: 20;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        border: 1px solid #0002ff; 
        text-align: center;
    }

    .marker:hover::after { display: block; }
    .marker.show-screenshot:hover::after { display: none; }

    /* БАЗОВЫЙ СТИЛЬ СКРИНШОТА (Здесь основные исправления) */
    .marker img {
        display: none;
        position: absolute;
        bottom: 25px; 
        left: 50%;
        transform: translateX(-50%);
        
        /* Вычисляемая ширина скриншота */
        width: calc(320px / (var(--map-scale, 1) * var(--mobile-zoom, 1)));
        
        /* ИСПРАВЛЕНИЕ ДЛЯ ПК: Картинка сжимается вслед за зумом, но НЕ МЕНЬШЕ 220px. 
           Это создаст красивый предел при отдалении карты */
        min-width: 130px; 
        /* Ограничитель сверху, чтобы при огромном приближении картинка не перекрывала всё */
        max-width: 450px; 

        aspect-ratio: 16 / 9; 
        height: auto; 
        
        border: calc(2px / (var(--map-scale, 1) * var(--mobile-zoom, 1))) solid #0002ff;
        border-radius: 6px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
        z-index: 100;
        pointer-events: none; 
        object-fit: cover;
    }

    /* Класс показа скрина */
    .marker.show-screenshot img {
        display: block;
        animation: fadeIn 0.2s ease-in-out;
    }

    .marker.show-screenshot { z-index: 9999; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-50%) translateY(5px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .marker.cards.collected {
        background-color: rgba(102, 102, 102, 0.5); 
        border: 1px solid rgba(153, 153, 153, 0.5); 
        box-shadow: none;                            
    }

    .marker.cards.collected img {
        opacity: 1 !important;
        filter: none !important;
    }

    /* Панель управления счетчиком */
.counter-box {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(20, 20, 20, 0.85);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    border: 1px solid #0002ff;
    z-index: 99999;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    gap: 12px;
}

.counter-box span:first-child {
    pointer-events: none; /* Текст не мешает кликам */
}

#counter-value {
    color: #0002ff;
}

/* Кнопка сброса */
#reset-btn {
    background: rgba(255, 68, 68, 0.2);
    border: 1px solid #ff4444;
    color: #ff8888;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: none; /* Скрыта по умолчанию */
}

#reset-btn:hover {
    background: #ff4444;
    color: #fff;
    box-shadow: 0 0 8px rgba(255, 68, 68, 0.5);
}

</style>


</head>

    HTML И CSS ДЛЯ ЭФФЕКТА RESPECT + В ТОЧНОМ СТИЛЕ GTA SA

<style>
    /* Подключаем ваш локальный шрифт Pricedown */
    @font-face {
        font-family: 'Pricedown';
        src: url('./fonts/pricedown.otf') format('opentype'); 
        font-weight: normal;
        font-style: normal;
    }

    /* Полный экран для оверлея */
    .respect-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0); 
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999; 
        pointer-events: none; 
        transition: background 0.8s ease;
    }

    /* Контейнер надписей */
    .gta-mission-box {
        font-family: 'Pricedown', 'Arial Black', sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0px; /* В игре строчки расположены очень близко друг к другу */
        opacity: 0;
        transform: scale(0.6);
        transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1.15);
    }

    /* 1. ВЕРХНЯЯ СТРОКА: Золотой градиент */
    .mission-title {
        font-size: 7.5rem;
        letter-spacing: -1px;
        background: linear-gradient(to bottom, #f3be27 0%, #cc7f00 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.05;
        /* Четкий черный контур для прозрачного градиентного текста */
        filter: drop-shadow(-2.5px -2.5px 0 #000) 
                drop-shadow(2.5px -2.5px 0 #000) 
                drop-shadow(-2.5px 2.5px 0 #000) 
                drop-shadow(2.5px 2.5px 0 #000);
    }

    /* 2. НИЖНЯЯ СТРОКА: Полностью белая с черной обводкой */
    .respect-row {
        font-size: 5rem;
        color: #ffffff;
        letter-spacing: -0.5px;
        line-height: 1.1;
        display: flex;
        align-items: center;
        gap: 12px;
        /* Классическая обводка text-shadow для сплошного белого цвета */
        text-shadow: 
            -2.5px -2.5px 0 #000,  2.5px -2.5px 0 #000, 
            -2.5px  2.5px 0 #000,  2.5px  2.5px 0 #000,
            -2.5px  0px   0 #000,  2.5px  0px   0 #000,  
                0px  -2.5px 0 #000,  0px   2.5px 0 #000;
    }

    /* Активация эффекта при вызове скрипта */
    .respect-overlay.active {
        background: rgba(0, 0, 0, 0.35); /* Легкое внутриигровое затемнение */
    }
    
    .respect-overlay.active .gta-mission-box {
        opacity: 1;
        transform: scale(1);
    }

    /* Корректное отображение на мобильных устройствах */
    @media (max-width: 768px) {
        .mission-title {
            font-size: 4rem;
        }
        .respect-row {
            font-size: 2.6rem;
            gap: 8px;
        }
        .mission-title {
            filter: drop-shadow(-1.5px -1.5px 0 #000) drop-shadow(1.5px -1.5px 0 #000) drop-shadow(-1.5px 1.5px 0 #000) drop-shadow(1.5px 1.5px 0 #000);
        }
        .respect-row {
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
        }
    }
</style>

<!-- Двухстрочный оверлей в точном соответствии с игрой -->
<div id="respect-screen" class="respect-overlay">
    <div class="gta-mission-box">
        <!-- Для шрифта Pricedown пишем именно строчными (маленькими) буквами -->
        <div class="mission-title">миссия выполнена!</div>
        <div class="respect-row">
            <span>УВАЖЕНИЕ</span>
            <span>+</span>
        </div>

<script>
    // Получаем необходимые элементы интерфейса
    const mapContainer = document.querySelector('.map-container');
    const counterValue = document.getElementById('counter-value');
    const resetBtn = document.getElementById('reset-btn');

    // Настройки для эффекта RESPECT
    const respectScreen = document.getElementById('respect-screen');
    const respectAudio = new Audio("./audio/respect2.m4a");
    let isRespectTriggered = false; // Защита от повторного спама эффекта

    // Настройки для ПК-зума за курсором
    let scale = 1;
    let posX = 0;
    let posY = 0;

    // Функция обновления счетчика и видимости кнопки сброса
    function updateCounter() {
        const total = document.querySelectorAll('.marker.cards').length;
        const collected = document.querySelectorAll('.marker.cards.collected').length;
        counterValue.textContent = `${collected}/${total}`;

        // Показываем кнопку "Сброс" только если собрана хотя бы одна тыква
        if (collected > 0) {
            resetBtn.style.display = 'inline-block';
        } else {
            resetBtn.style.display = 'none';
        }

        // Если при загрузке или обновлении не все собрано, сбрасываем флаг триггера респекта
        if (collected < total) {
            isRespectTriggered = false;
        }
    }

    // Функция активации эффекта RESPECT +
    function triggerRespectEffect() {
        if (isRespectTriggered) return; // Если уже горит на экране, игнорируем
        isRespectTriggered = true;

        respectScreen.classList.add('active');
        respectAudio.play().catch(e => console.log("Кликните по карте, чтобы браузер разрешил воспроизведение звука"));

        // Через 4 секунды плавно убираем надпись с экрана
        setTimeout(() => {
            respectScreen.classList.remove('active');
        }, 13000);
    }

    // Обработчик клика по кнопке сброса прогресса
    resetBtn.addEventListener('click', () => {
        if (confirm('Вы уверены, что хотите сбросить весь прогресс фото призраков?')) {
            // Удаляем статус "собрано" у всех тыкв на карте и из localStorage
            document.querySelectorAll('.marker.cards').forEach(marker => {
                marker.classList.remove('collected');
                localStorage.removeItem(marker.id);
            });
            
            // Закрываем открытые скриншоты при сбросе
            document.querySelectorAll('.marker.cards').forEach(m => m.classList.remove('show-screenshot'));
            
            // Обновляем панель счетчика
            updateCounter();
        }
    });

    // 1. УМНЫЙ ЗУМ ЗА МЫШКОЙ (ПК)
    mapContainer.addEventListener('wheel', (e) => {
        e.preventDefault();

        const rect = mapContainer.getBoundingClientRect();
        // Находим координаты мышки относительно самой карты
        const mouseX = (e.clientX - rect.left) / scale;
        const mouseY = (e.clientY - rect.top) / scale;

        // Рассчитываем новый масштаб
        const zoomFactor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
        const nextScale = Math.max(1, Math.min(scale * zoomFactor, 25)); // Макс зум 25х

        // Корректируем сдвиг X и Y, чтобы точка под курсором осталась на месте
        posX = e.clientX - rect.left - mouseX * nextScale + posX;
        posY = e.clientY - rect.top - mouseY * nextScale + posY;
        scale = nextScale;

        // Если вернулись к исходному размеру — сбрасываем сдвиги центра
        if (scale === 1) { posX = 0; posY = 0; }

        // Передаем координаты и масштаб в CSS переменные
        mapContainer.style.setProperty('--map-scale', scale);
        mapContainer.style.setProperty('--zoom-x', `${posX}px`);
        mapContainer.style.setProperty('--zoom-y', `${posY}px`);
    }, { passive: false });


    // 2. СЛУШАТЕЛЬ УМЕНЬШЕНИЯ ДЛЯ СМАРТФОНОВ (Родной мобильный зум)
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            mapContainer.style.setProperty('--mobile-zoom', window.visualViewport.scale);
        });
    }


    // 3. БАЗОВАЯ ЛОГИКА (Авто-ID, Сбор тыкв, Показ JPG скринов)
    document.querySelectorAll('.marker.cards').forEach((marker, index) => {
        // Автоматически даем ID, если его нет в HTML
        if (!marker.id) marker.id = 'p' + (index + 1);
        
        // Восстанавливаем сохраненный прогресс из памяти браузера
        if (localStorage.getItem(marker.id) === 'collected') {
            marker.classList.add('collected');
        }
    });

    // Первичный расчет счетчика сразу при загрузке страницы
    updateCounter();

    // Слушатель кликов по карте и меткам
    mapContainer.addEventListener('click', (event) => {
        const clickedMarker = event.target.closest('.marker.cards');

        if (clickedMarker) {
            event.stopPropagation(); 
            if (event.target.tagName === 'IMG') return;

            // Переключение статуса: Клик по тыкве (собрано / не собрано)
            if (clickedMarker.classList.contains('collected')) {
                clickedMarker.classList.remove('collected');
                localStorage.removeItem(clickedMarker.id); 
            } else {
                clickedMarker.classList.add('collected');
                localStorage.setItem(clickedMarker.id, 'collected'); 
            }

            // Сразу обновляем цифры в счетчике после переключения класса
            updateCounter();

            // ПРОВЕРКА НА RESPECT: Если после клика собраны абсолютно все тыквы
            const totalItems = document.querySelectorAll('.marker.cards').length;
            const collectedItems = document.querySelectorAll('.marker.cards.collected').length;
            if (collectedItems === totalItems && totalItems > 0) {
                triggerRespectEffect();
            }

            // Открытие скриншота весом 40 КБ и подмена data-src на src (Lazy Loading)
            if (clickedMarker.classList.contains('show-screenshot')) {
                clickedMarker.classList.remove('show-screenshot');
            } else {
                // Сначала закрываем скриншоты у всех остальных тыкв
                document.querySelectorAll('.marker.cards').forEach(m => m.classList.remove('show-screenshot'));
                
                // Загружаем картинку только в момент открытия
                const img = clickedMarker.querySelector('img');
                if (img && img.getAttribute('data-src')) {
                    img.src = img.getAttribute('data-src');
                    img.removeAttribute('data-src'); // Убираем атрибут, чтобы не перезагружать повторно
                }
                clickedMarker.classList.add('show-screenshot');
            }

        } else {
            // Клик мимо тыквы — закрыть все открытые скриншоты
            document.querySelectorAll('.marker.cards').forEach(marker => {
                marker.classList.remove('show-screenshot');
            });

            // Код для разработчика (Генерация новых точек в F12 при клике на карту)
            const rect = mapContainer.getBoundingClientRect();
            const left = (((event.clientX - rect.left) / scale) / 684 * 100).toFixed(1);
            const top = (((event.clientY - rect.top) / scale) / 1017 * 100).toFixed(1);
            const nextIndex = document.querySelectorAll('.marker.cards').length + 1;
            
            console.log(`<div class="marker cards" style="left: ${left}%; top: ${top}%;" data-title="Тыква ${nextIndex}"><img data-src="./cardss/${nextIndex}.jpg" alt="в работе"></div>`);
            
            // Обновляем счетчик на случай, если вы скопируете новую точку прямо в DOM через инспектор
            updateCounter();
        }
    });
</script>


</body>
